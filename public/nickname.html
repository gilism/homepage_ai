<!-- 2026-11-28 rev.15 — 닉네임 입력 화면 처음 만듦: 처음 가입할 때 한 번만, 10분 안에 [가입 완료] -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>닉네임 정하기 — 호서대학교 × 일잘러랩 AI 특강</title>
<style>
  /* ===== 기본 색상·글꼴 (index.html과 같은 색: 어두운 바탕 + 흰 둥근 카드 + 진한 초록) ===== */
  :root{--dark:#0f1210;--lime:#e2f96a;--green:#2f4a37;--paper:#f4f4f1;--white:#fff;--text:#1a1d1a;--muted:#5b625c;--line:#dcdfd9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
    font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    color:var(--text);line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%;
    background:radial-gradient(120% 80% at 50% 0%,#1e2a22 0%,var(--dark) 60%)}

  /* ===== 헤더 ===== */
  .header .inner{max-width:1040px;margin:0 auto;padding:0 20px;height:68px;display:flex;align-items:center}
  .brand{display:flex;align-items:center;gap:8px;color:var(--white);text-decoration:none;font-weight:700;font-size:14px}
  .logo-img{background:var(--white);border-radius:10px;padding:4px 8px;display:flex}
  .logo-img img{height:24px;width:auto;display:block}

  /* ===== 가운데 카드 ===== */
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 56px}
  .card{width:100%;max-width:420px;background:var(--white);border-radius:28px;padding:36px 24px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
  .eyebrow{color:var(--green);font-weight:700;font-size:14px;margin-bottom:6px}
  h1{font-size:clamp(26px,7vw,32px);letter-spacing:-0.02em;line-height:1.25;margin-bottom:10px}
  .desc{color:var(--muted);font-size:15px;margin-bottom:26px}

  /* ===== 로그인 버튼 목록 (나중에 네이버·구글 버튼을 이 안에 한 줄씩 추가) ===== */
  .social{display:flex;flex-direction:column;gap:10px}
  .s-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:14px;border:0;
    font:inherit;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .2s ease,filter .2s ease}
  .s-btn:hover{transform:translateY(-2px);filter:brightness(1.03)}
  .s-btn:active{transform:none}
  .s-btn svg{width:20px;height:20px;flex:none}
  .s-kakao{background:#FEE500;color:rgba(0,0,0,.85)}

  /* ===== 아래 안내 링크 ===== */
  .switch{margin-top:22px;font-size:14px;color:var(--muted)}
  .switch a{color:var(--green);font-weight:700}
  .home{display:inline-block;margin-top:10px;font-size:14px;color:var(--muted)}

  /* ===== 닉네임 입력 ===== */
  .field{text-align:left;margin-bottom:12px}
  .field label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
  .field input{width:100%;min-height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:17px}
  .field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(47,74,55,.18)}
  .hint{color:var(--muted);font-size:13px;text-align:left;margin-bottom:12px}
  .err{color:#b3261e;font-weight:600;font-size:15px;text-align:left;margin-bottom:12px}
  .err:empty{display:none}
  .btn{width:100%;min-height:54px;border:0;border-radius:999px;background:var(--green);color:var(--white);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .btn[disabled]{opacity:.6;cursor:default}

  @media (min-width:768px){
    .header .inner{padding:0 32px}
    .brand{font-size:17px;gap:12px}
    .logo-img img{height:30px}
    .card{padding:44px 40px 34px}
  }
</style>
</head>
<body>

<!-- 헤더 (누르면 홈으로) -->
<header class="header">
  <div class="inner">
    <a class="brand" href="/"><span class="logo-img"><img src="images/hoseo_logo.png" alt="호서대학교 HOSEO UNIVERSITY"></span>호서대학교 × 일잘러랩</a>
  </div>
</header>

<main>
  <!-- 닉네임 입력 카드 -->
  <section class="card">
    <p class="eyebrow">마지막 단계</p>
    <h1>닉네임을 정해 주세요</h1>
    <p class="desc">홈 화면에 "○○님"으로 보여 드립니다.</p>

    <form id="nick-form" novalidate>
      <div class="field">
        <label for="nickname">닉네임</label>
        <input id="nickname" name="nickname" type="text" maxlength="12" autocomplete="nickname" required>
      </div>
      <p class="hint">2~12자, 한글·영문·숫자만 쓸 수 있어요.</p>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="done" type="submit">가입 완료</button>
    </form>
    <a class="home" href="/signup.html">← 처음부터 다시 가입</a>
  </section>
</main>

<script>
  // 닉네임 저장: 서버(/api/nickname)에 보내고, 저장되면 브라우저에 기억한 뒤 홈으로
  (function(){
    var f=document.getElementById('nick-form'),inp=document.getElementById('nickname'),err=document.getElementById('err'),btn=document.getElementById('done');
    inp.focus();
    f.addEventListener('submit',function(e){
      e.preventDefault();err.textContent='';
      var v=inp.value.trim();
      if(!v){err.textContent='닉네임을 입력해 주세요.';inp.focus();return;}
      if(!/^[가-힣a-zA-Z0-9]{2,12}$/.test(v)){err.textContent='닉네임은 2~12자의 한글·영문·숫자로 정해 주세요.';inp.focus();return;}
      btn.disabled=true;
      fetch('/api/nickname',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname:v})})
        .then(function(r){return r.json().catch(function(){return {}})})
        .then(function(d){
          if(d.ok){try{localStorage.setItem('member_nickname',d.nickname)}catch(e){}location.replace('/');return;}
          err.textContent=d.message||'닉네임을 저장하지 못했습니다. 잠시 뒤 다시 시도해 주세요.';
          btn.disabled=false;
          if(d.expired){btn.textContent='처음부터 다시 가입';btn.disabled=false;btn.onclick=function(ev){ev.preventDefault();location.href='/signup.html'};}
        })
        .catch(function(){err.textContent='서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.';btn.disabled=false;});
    });
  })();
</script>

</body>
</html>
